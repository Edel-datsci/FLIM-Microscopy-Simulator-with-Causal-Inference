# ═══════════════════════════════════════════════════════════════════════
# ED-MRDT Configuration: PIP3/PTEN phosphoinositide signaling
# ═══════════════════════════════════════════════════════════════════════
#
# System: PI3K/PTEN-mediated PIP2↔PIP3 conversion on plasma membrane
# Observable: FLIM-FRET imaging of PH-Akt biosensor binding to PIP3
# Reference: Nolte et al., Nature Cell Biol 2009 (PI3K/PTEN dynamics)
#            Saarikangas & Barral, Nat Rev Mol Cell Biol 2011 (actin regulation)
#            mTFP1/Venus FRET pair: Ai et al., Nat Biotechnol 2006 (Förster pair)
#
# Area: 5×5 µm² — sufficient for propagating PIP3 waves and PTEN redistribution.
#   Justification (5 criteria):
#     C1: Wave period ~20s requires L >> λ/4 ≈ 2.5 µm → L=5µm ✅
#     C2: PBC correlation length (PIP3) ~ 1-2 µm << 5 µm ✅
#     C3: FOV ≥ 4×4 independent PSFs → 50×50 pixels = 2500 PSFs ✅
#     C4: ≥30 labeled biosensors → ~63 at L=5µm (5% labeling) ✅
#     C5: Nyquist sampling with 100nm pixels → 50×50 pixels ✅
#
# Units convention:
#   Length:  µm (micrometers) for membrane, nm for molecular
#   Time:   s (seconds)
#   Rates:  s⁻¹ (unimolecular/catalytic), µm²/s (diffusion), M⁻¹s⁻¹ (bimolecular 2D)
#   Energy: kBT (thermal units)
#
# Biology (Knoch et al. 2014 + Fabian 2014 — Dictyostelium excitable waves):
#   PIP2 ↔ PIP3 conversion is driven by two opposing enzymes:
#     • PI3K catalyzes PIP2 → PIP3 with POSITIVE FEEDBACK (PIP3 auto-amplifies PI3K)
#     • PTEN catalyzes PIP3 → PIP2 (two conformers: T1=basal/weak, T2=activated/strong)
#   PTEN_T1 (PTEN*) = basal form, low k_cat (0.005 s⁻¹)
#   PTEN_T2 (PTEN**) = activated form, high k_cat (0.45 s⁻¹, 90× T1)
#   T1→T2 conversion is PROMOTED by local PIP3 (PTEN activation, Knoch positive feedback).
#   PTEN_T1 RECRUITMENT is inhibited by PIP3 + promoted by local PTEN_T2 (PTEN bistability).
#   PI3K positive feedback + PTEN bistability → excitable wave propagation.
#   PH-Akt biosensor (mTFP1/Venus FRET) reports local PIP3 via proximity FRET.
# ═══════════════════════════════════════════════════════════════════════

name: "PIP3/PTEN membrane signaling FLIM-FRET"
version: "1.1.0"

# ─── MEMBRANE DOMAIN ─────────────────────────────────────────────────
membrane:
  size: [5.0, 5.0]              # µm × µm (supports wave dynamics)
  periodic: [true, true]        # PBC = infinite homogeneous membrane
  geometry_type: planar

# ─── DIFFUSION FIELD ────────────────────────────────────────────────
# Spatially heterogeneous D(x) from lipid raft domains.
# Raft interior: D reduced to 30% of bulk (cholesterol-dependent ordering).
# Raft center: (2.5, 2.5) µm, radius 1.0 µm on the 5×5 µm² membrane.
#
# Sigmoid smoothing (region_smoothing_width in simulation params) ensures
# finite ∇D at boundaries → correct Ermak-McCammon drift correction.
#
# Reference: Leu & Jain (2017) Langmuir 33:14783 — D reduction in lo phase.
#            Lau & Lubensky (2007) PRE 76:011123 — spurious drift without ∇D.
#
diffusion_field:
  type: regions
  default_D_factor: 1.0
  regions:
    - shape: circle
      center: [2.5, 2.5]
      radius: 1.0
      D_factor: 0.3

# ─── MOLECULAR SPECIES ───────────────────────────────────────────────
# Phosphoinositide lipids are 2D membrane anchors with fast lateral diffusion.
# Kinases and phosphatases are larger, slower-moving proteins.
#
species:
  - name: PIP2
    diffusion_coefficient: 0.1  # µm²/s (Fabian 2014: D_PIP = 0.1 µm²/s for membrane lipids)
    radius: 0.5                 # nm (small headgroup, approx)
    color: "#1976D2"

  - name: PIP3
    diffusion_coefficient: 0.1  # µm²/s (same as PIP2 — both are membrane-anchored lipids)
    radius: 0.5                 # nm
    color: "#D32F2F"

  - name: PI3K
    diffusion_coefficient: 0.1  # µm²/s (membrane-bound kinase, catalytic domain ~40kDa)
    radius: 4.0                 # nm (p85-p110 heterodimer)
    color: "#F57C00"

  - name: PTEN_T1
    diffusion_coefficient: 0.08 # µm²/s (Fabian 2014; protein << lipid per Saffman-Delbrück)
    radius: 4.0                 # nm
    color: "#388E3C"

  - name: PTEN_T2
    diffusion_coefficient: 0.08 # µm²/s (Fabian 2014; protein << lipid per Saffman-Delbrück)
    radius: 4.0                 # nm
    color: "#7CB342"

  # ── PH-Akt BIOSENSOR ────────────────────────────────────────────────
  # Free PH-Akt biosensor on membrane (carries mTFP1 + Venus).
  # D ~ 0.08 µm²/s (peripheral membrane protein, similar to PTEN).
  # Reference: Varnai & Balla, J Cell Biol 1998 (PH domain dynamics).
  - name: PHAkt
    diffusion_coefficient: 0.08  # µm²/s (membrane-associated protein)
    radius: 3.0                  # nm (PH domain ~15 kDa)
    color: "#9C27B0"

  # PH-Akt bound to PIP3 (complex). FRET active in this state.
  # Slightly slower diffusion (larger complex).
  # Reference: Lemmon, Nat Rev Mol Cell Biol 2008 (PH-PIP3 binding).
  - name: PHAkt_PIP3
    diffusion_coefficient: 0.06  # µm²/s (complex: PHAkt + lipid)
    radius: 3.5                  # nm
    color: "#E91E63"
    states: [bound]

# ─── REACTIONS ────────────────────────────────────────────────────────
# PH-Akt biosensor binding: PHAkt + PIP3 ⇌ PHAkt_PIP3
# kon = 0.05 µm²/s (2D on-rate, PH domain binding to PIP3 headgroup)
# koff = 0.5 s⁻¹ (residence time ~2s, typical for PH domains)
# Kd_2D ~ koff/kon = 10 /µm² → biosensor saturates above ~10 PIP3/µm²
# Reference: Corbin et al., Biochemistry 2004 (PH-Akt Kd ~ 200-500 nM)
#            Lasserre et al., J Cell Biol 2008 (2D binding kinetics)
reactions:
  - name: PHAkt_PIP3_binding
    reactants: [PHAkt, PIP3]
    products: [PHAkt_PIP3]
    kon: 0.05                    # µm²/s (2D macroscopic on-rate)
    koff: 0.5                    # s⁻¹ (τ_residence ~ 2s)
    contact_radius: 5.0          # nm (headgroup interaction distance)

# ─── CATALYTIC REACTIONS ──────────────────────────────────────────────
# Enzymes perform repeated turnover: E + S ⇌ ES → E + P
# Modeled as probabilistic encounter (contact_radius) + elementary rate (k_cat).
#
catalytic_reactions:
  # PI3K forward reaction: PIP2 → PIP3
  # k_cat = 5e-3 s⁻¹ is typical for Class IA PI3K (p85-p110) turnover.
  # POSITIVE FEEDBACK: PIP3 recruits more PI3K via Ras/actin pathway → auto-amplification.
  # This is THE excitable wave driver (Fabian 2014, Nat Commun 2018).
  # Model: k_eff = k_cat × [PIP3]^n / (K^n + [PIP3]^n) — Hill activation.
  # Reference: Vanhaesebroeck & Waterfield, Exp Cell Res 1999.
  - name: PI3K_phosphorylation
    enzyme: PI3K
    substrate: PIP2
    product: PIP3
    k_cat: 1.0e-2               # s⁻¹ (Fabian 2014: k_PI3K = 0.01 s⁻¹)
    contact_radius: 50.0        # nm (calibrated BD reaction radius)
    # NO feedback on catalysis — PI3K always phosphorylates PIP2 at constant k_cat.
    # Positive feedback acts on PI3K RECRUITMENT (compartment_exchange below):
    # PIP3 ↑ → more PI3K recruited from cytosol → more PIP2→PIP3 → PIP3 ↑↑
    # This avoids the absorbing state problem: at PIP3=0, hill_activation=0
    # would kill all PI3K activity with no recovery. (substrate capture radius)

  # PTEN_T1 reverse reaction: PIP3 → PIP2 (BASAL / cytosolic form)
  # PTEN_T1 = PTEN* in Knoch et al. (2014): LOW catalytic activity.
  # This is the cytosolic/weakly-bound form that has NOT been activated
  # by membrane PIP3. Serves as the "resting" PTEN pool.
  # k_cat = 5e-3 s⁻¹ (basal, ~90× weaker than activated T2)
  # Reference: Knoch, Tarantola, Bodenschatz & Rappel (2014) — PTEN* model.
  - name: PTEN_T1_dephosphorylation
    enzyme: PTEN_T1
    substrate: PIP3
    product: PIP2
    k_cat: 5.0e-3               # s⁻¹ (BASAL: PTEN* in Knoch et al.)
    contact_radius: 50.0        # nm (calibrated BD reaction radius)

  # PTEN_T2 reverse reaction: PIP3 → PIP2 (ACTIVATED / membrane form)
  # PTEN_T2 = PTEN** in Knoch et al. (2014): HIGH catalytic activity.
  # This is the membrane-activated conformer with ~90× higher k_cat.
  # Activated by local PIP3 via T1→T2 conversion (see unimolecular_conversions).
  # k_cat = 0.45 s⁻¹ (90 × 0.005 = 0.45, Knoch ratio)
  # Reference: Knoch, Tarantola, Bodenschatz & Rappel (2014) — PTEN** model.
  - name: PTEN_T2_dephosphorylation
    enzyme: PTEN_T2
    substrate: PIP3
    product: PIP2
    k_cat: 4.5e-1               # s⁻¹ (ACTIVATED: 90× T1, Knoch et al.)
    contact_radius: 50.0        # nm (calibrated BD reaction radius)

# ─── COMPARTMENT EXCHANGES ────────────────────────────────────────────
# Proteins freely exchange between membrane and cytosol pools.
# PTEN_T1 recruitment is feedback-inhibited by local PIP3 (negative regulation).
# PTEN_T2 recruitment is not inhibited (represents basal cytosolic exchange).
#
compartment_exchanges:
  # ── PI3K ↔ cytosol: POSITIVE FEEDBACK via PIP3-Ras pathway ──
  # PIP3 activates Ras → recruits more PI3K to membrane → more PIP2→PIP3.
  # This is the EXCITABLE WAVE DRIVER. Basal membrane PI3K always works,
  # but high local PIP3 brings MORE PI3K from cytosol = amplification.
  #
  # k_on = 2e-3 s⁻¹ (basal recruitment, modulated by pip3_activation)
  # k_off = 5e-3 s⁻¹ (short membrane residence, τ ≈ 200ms)
  # cytosol_pool = 200 (large Ras-PI3K reservoir)
  #
  # Reference: Huang et al. (2013) PNAS 110:E4437 — PI3K-Ras positive loop.
  #            Fabian et al. (2014) J R Soc Interface — PI3K recruitment model.
  - name: PI3K_membrane_cytosol
    species: PI3K
    k_on: 2.0e-3                # s⁻¹ (basal, amplified by pip3_activation)
    k_off: 5.0e-3               # s⁻¹ (fast turnover)
    cytosol_pool: 200           # Large Ras-PI3K cytosolic reservoir
    max_recruits_per_step: 5
    feedback_rule: pip3_activation  # PIP3 amplifies PI3K recruitment

  # ── PTEN_T1 ↔ cytosol: TRANSIENT binding state ──
  # PTEN_T1 = transiently/weakly bound (Matsuoka 2018: "transient" state).
  # Fast diffusion (D=0.45), fast detachment (k_off=4.7 s⁻¹, τ=0.21s).
  # Recruitment inhibited by PIP3 + promoted by local PTEN_T2.
  # Most newly recruited PTEN starts as T1. If local PIP3 is high,
  # T1→T2 conversion is fast → becomes stably bound (Knoch positive feedback).
  # If PIP3 is low, T1 detaches in ~0.2s → rapid membrane turnover.
  #
  # k_on = 5e-3 s⁻¹ (recruitment from cytosol, feedback-modulated)
  # k_off = 4.7 s⁻¹ (Matsuoka 2018 Fig 5c: transient dissociation)
  # Reference: Matsuoka & Ueda (2018) Nat Commun 9:4481; Knoch et al. (2014)
  - name: PTEN_T1_membrane_cytosol
    species: PTEN_T1
    k_on: 5.0e-3                # s⁻¹ (recruitment rate from cytosol)
    k_off: 4.7                  # s⁻¹ (Matsuoka 2018: transient τ=0.21s)
    cytosol_pool: 200           # Cytosolic reservoir (particles)
    max_recruits_per_step: 5    # Maximum simultaneous recruitment
    feedback_rule: pip3_inhibition  # Primary: PIP3 inhibits PTEN_T1 recruitment
    secondary_feedback_rule: pten_self_activation  # Secondary: PTEN_T2 promotes recruitment

  # ── PTEN_T2 ↔ cytosol: STABLY bound state ──
  # PTEN_T2 = stably bound (Matsuoka 2018: "stably" state).
  # Slow diffusion (D=0.01), slow detachment (k_off=0.22 s⁻¹, τ=4.5s).
  # T2 is NOT directly recruited from cytosol — it arrives via T1→T2 conversion.
  # k_on = 0 (T2 only forms from T1 on-membrane, not recruited directly).
  # k_off = 0.22 s⁻¹ at low PIP3 (Matsuoka 2018 Table 1: k₁=0.22 s⁻¹).
  # At high PIP3: k_off increases to ~1.1 s⁻¹ (5× faster, Matsuoka Fig 5c).
  # This PIP3-dependent dissociation is the "substrate-induced release" mechanism.
  # Reference: Matsuoka & Ueda (2018) Nat Commun 9:4481, Table 1 & Fig 5c
  # ── PHAkt ↔ cytosol: PIP3-DEPENDENT recruitment (biosensor translocation) ──
  # PH_CRAC/PH-Akt domain translocates from cytosol to membrane where PIP3 is high.
  # This is the PRIMARY contrast mechanism in TIRF imaging:
  #   PIP3 high → more PHAkt recruited → more intensity + more FRET (τ↓)
  #   PIP3 low  → PHAkt stays in cytosol → dim + no FRET (τ = τ_donor)
  #
  # k_on = 5e-3 s⁻¹ (basal, strongly amplified by pip3_activation feedback)
  # k_off = 0.5 s⁻¹ (residence time ~2s, consistent with PH domain binding)
  # cytosol_pool = 5000 (large cytosolic reservoir — PH-Akt is overexpressed)
  #
  # Reference: Varnai & Balla 1998 (PH translocation); Gerisch 2012 (TIRF dynamics);
  #            Iijima & Devreotes 2002 (PH_CRAC cytosol↔membrane exchange).
  - name: PHAkt_membrane_cytosol
    species: PHAkt
    k_on: 5.0e-3                # s⁻¹ (basal recruitment, amplified by PIP3)
    k_off: 0.5                  # s⁻¹ (membrane residence ~2s)
    cytosol_pool: 5000          # Large cytosolic reservoir (overexpressed biosensor)
    max_recruits_per_step: 10
    feedback_rule: pip3_activation  # PIP3 AMPLIFIES recruitment → translocation contrast

  - name: PTEN_T2_membrane_cytosol
    species: PTEN_T2
    k_on: 0.0                   # NOT recruited directly (arrives via T1→T2)
    k_off: 1.1                  # s⁻¹ (BASE for feedback: 1.1×0.2=0.22 at PIP3=0, 1.1×1.0=1.1 at high PIP3)
    cytosol_pool: 100           # Smaller cytosolic reservoir
    max_recruits_per_step: 5
    detachment_feedback_rule: pip3_detachment_boost  # PIP3 accelerates T2 release

# ─── UNIMOLECULAR CONVERSIONS ─────────────────────────────────────────
# PTEN isoforms interconvert: T1 ↔ T2 (conformational switching or post-translational modification)
# This models the dynamic regulation of PTEN activity on the membrane.
# Reference: Pullen et al., Biochemistry 2004 (PTEN conformational states).
#
unimolecular_conversions:
  # T1 → T2: PTEN activation (PTEN* → PTEN**) — PIP3-dependent.
  # In Knoch et al.: PTEN activation is promoted by local PIP3 (positive feedback).
  # This is the PTEN BISTABILITY DRIVER: more PIP3 → more PTEN** → more PIP3→PIP2.
  # Base rate = 0.015 s⁻¹, amplified by local PIP3 via feedback_rule.
  # Reference: Knoch et al. (2014) — k_a in PTEN activation equation.
  - name: T1_to_T2
    from_species: PTEN_T1
    to_species: PTEN_T2
    rate: 0.015                 # s⁻¹ (base rate, amplified by pip3_activation_pten)
    feedback_rule: pip3_activation_pten  # PIP3 promotes T1→T2 (Knoch positive feedback)

  # T2 → T1: PTEN deactivation (PTEN** → PTEN*) — spontaneous.
  # Spontaneous reversion to basal state. No feedback (first-order decay).
  # Reference: Knoch et al. (2014) — k_d in PTEN deactivation.
  - name: T2_to_T1
    from_species: PTEN_T2
    to_species: PTEN_T1
    rate: 0.015                 # s⁻¹ (spontaneous deactivation)

# ─── FEEDBACK RULES ───────────────────────────────────────────────────
# Hill-type inhibition: PTEN activity is suppressed by local PIP3 concentration.
# This creates a biphasic response and allows wave propagation.
# K_half = 200 particles/µm² = ~0.33 µM (physiologically plausible).
# n_hill = 3 (strong cooperativity, consistent with allosteric inhibition).
# Reference: Nolte et al., Nature Cell Biol 2009 (PIP3-mediated PTEN inhibition).
#
feedback_rules:
  # PIP3 inhibits PTEN recruitment to membrane (negative regulation).
  # When local [PIP3] is high, PTEN_T1 cannot bind → mutual exclusion.
  # Reference: Nolte et al., Nature Cell Biol 2009.
  - name: pip3_inhibition
    sensor_species: PIP3
    function_type: hill_inhibition
    K_half: 200.0               # particles/µm² (range: 50-500)
    n_hill: 3.0                 # Hill exponent (strong cooperativity)
    grid_resolution: 0.2        # µm (spatial granularity for inhibition)

  # PIP3 auto-amplifies PI3K recruitment (positive feedback).
  # This is the EXCITABLE WAVE DRIVER: local PIP3 → recruits more PI3K
  # via Ras-GTP or F-actin-mediated membrane association.
  # Without this feedback, the system reaches a dead equilibrium (no waves).
  #
  # K_half MUST be near basal PIP3 density (~20/µm²) to place the system
  # at the bifurcation threshold where stochastic fluctuations can trigger
  # positive feedback cascades. K_half >> basal → feedback is negligible.
  #
  # basal_fraction = 0.05: prevents absorbing state at PIP3=0.
  # At PIP3=0: hill_factor = 0.05 (not zero → basal recruitment survives).
  # At PIP3>>K: hill_factor → 1.0 (full amplification).
  #
  # n_hill = 2 (moderate cooperativity, typical for Ras-PI3K axis).
  # Reference: Fabian et al. (2014) J R Soc Interface 11:20140641.
  #            Huang et al. (2013) PNAS 110:E4437 (PI3K positive feedback).
  - name: pip3_activation
    sensor_species: PIP3
    function_type: hill_activation
    K_half: 20.0                # particles/µm² (at basal PIP3 → bifurcation)
    n_hill: 2.0                 # Hill exponent (moderate cooperativity)
    grid_resolution: 0.2        # µm (same grid as inhibition)
    basal_fraction: 0.05        # Prevents absorbing state at PIP3=0

  # PIP3 promotes PTEN T1→T2 conversion (PTEN activation).
  # This creates the PTEN BISTABILITY required by Knoch et al.:
  # High local PIP3 → converts PTEN_T1 (weak) to PTEN_T2 (90× stronger)
  # → rapid PIP3 clearance → PTEN stays in T2 (positive feedback loop).
  #
  # K_half = 50 particles/µm² (higher threshold than PI3K activation,
  # so PTEN activation requires a stronger PIP3 signal).
  # n_hill = 2 (cooperativity matches Knoch model).
  # basal_fraction = 0.05 (some spontaneous T1→T2 even without PIP3).
  # Reference: Knoch et al. (2014) PLOS Comput Biol — PTEN activation model.
  - name: pip3_activation_pten
    sensor_species: PIP3
    function_type: hill_activation
    K_half: 50.0                # particles/µm² (PTEN activation threshold)
    n_hill: 2.0                 # Hill exponent
    grid_resolution: 0.2        # µm
    basal_fraction: 0.05        # Spontaneous T1→T2 even at PIP3=0

  # PIP3-dependent PTEN_T2 DETACHMENT BOOST (Matsuoka & Ueda 2018).
  # PIP3 bound to PTEN catalytic site → releases PTEN from stably bound state.
  # This is the substrate-induced release mechanism (Fig. 5c, e).
  # Low PIP3: k_off(T2) = 0.22 s⁻¹ (base, from Table 1)
  # High PIP3: k_off(T2) → 1.1 s⁻¹ (5× faster, from Fig 5c)
  # Hill activation: k_off_eff = k_off_base × [α + (1-α) × h(ρ_PIP3)]
  # With α=1.0 (basal=full base rate) and max amplification factor 5×:
  # k_off_eff at saturation = 0.22 × 5.0 = 1.1 s⁻¹ ✓
  # Reference: Matsuoka & Ueda (2018) Nat Commun 9:4481
  - name: pip3_detachment_boost
    sensor_species: PIP3
    function_type: hill_activation
    K_half: 50.0                # particles/µm² (moderate threshold)
    n_hill: 2.0                 # Hill exponent
    grid_resolution: 0.2        # µm
    basal_fraction: 0.2         # At PIP3=0: factor=0.2 → k_off=0.22×0.2... see note
    # NOTE: basal_fraction=0.2 means at PIP3=0, factor=0.2.
    # We set k_off_base = 1.1 in YAML so that:
    #   PIP3=0: k_off_eff = 1.1 × 0.2 = 0.22 s⁻¹ (matches Table 1)
    #   PIP3→∞: k_off_eff = 1.1 × 1.0 = 1.1 s⁻¹ (matches Fig 5c)

  # PTEN self-feedback for BISTABILITY (Knoch et al. 2014).
  # Local PTEN_T2 density promotes MORE PTEN recruitment to the same region.
  # This is the PTEN BISTABILITY MECHANISM: once enough PTEN_T2 accumulates,
  # it recruits more PTEN from cytosol, creating a self-reinforcing domain.
  # Implements the PTEN positive self-loop described in Knoch §2.1.
  #
  # K_half = 30 particles/µm² (moderate threshold for self-amplification).
  # n_hill = 2 (moderate cooperativity).
  # basal_fraction = 0.1 (significant basal recruitment without local PTEN).
  # Reference: Knoch et al. (2014) — PTEN membrane association cooperativity.
  - name: pten_self_activation
    sensor_species: PTEN_T2
    function_type: hill_activation
    K_half: 30.0                # particles/µm² (self-amplification threshold)
    n_hill: 2.0                 # Hill exponent
    grid_resolution: 0.2        # µm
    basal_fraction: 0.1         # Basal recruitment even without local PTEN_T2

# ─── INITIAL POPULATIONS ──────────────────────────────────────────────
# Densities on 5×5 µm² = 25 µm²:
#   PIP2: 100/µm² → 2500 particles (basal phosphoinositide)
#   PIP3: 20/µm² → 500 particles (activated by PI3K)
#   PI3K: 5/µm² → 125 particles (catalytic kinase)
#   PTEN_T1: 10/µm² → 250 particles (strong membrane-bound phosphatase)
#   PTEN_T2: 5/µm² → 125 particles (weak variant)
# These are typical for mammalian fibroblasts in basal state.
#
initial_populations:
  PIP2: 2500                    # 100/µm² × 25 µm²
  PIP3: 500                     # 20/µm² × 25 µm² (basal activation)
  PI3K: 125                     # 5/µm² × 25 µm²
  PTEN_T1: 250                  # 10/µm² × 25 µm²
  PTEN_T2: 125                  # 5/µm² × 25 µm²

# ─── FLUOROPHORE PHOTOPHYSICS ────────────────────────────────────────
# mTFP1 (donor, ~27kDa GFP variant) and Venus (acceptor, ~28kDa YFP variant)
# are fused to PH-Akt biosensor for proximity-based FRET readout of PIP3.
#
# mTFP1 photophysics:
#   τ_rad = 2.8 ns (excited state lifetime)
#   QY = 0.85 (high quantum yield, efficient photon emission)
#   λ_em = 492 nm (blue-shifted GFP)
#   Extinction coeff = 64000 M⁻¹cm⁻¹ (moderate absorption)
# Reference: Ai et al., Nat Biotechnol 2006 (FP characterization).
#
# Venus photophysics:
#   τ_rad = 3.0 ns (excited state lifetime)
#   QY = 0.57 (moderate quantum yield, good FRET acceptor)
#   λ_em = 528 nm (yellow-green YFP variant)
#   Extinction coeff = 92200 M⁻¹cm⁻¹ (strong absorption, excellent FRET acceptor)
# Reference: Nagai et al., Nat Biotechnol 2002 (Venus characterization).
#
fluorophores:
  - name: mTFP1
    states:
      - name: S0
        is_fluorescent: false
        is_absorbing: true
      - name: S1
        is_fluorescent: true
        quantum_yield: 0.85
        emission_wavelength: 492.0
      - name: T1
        is_fluorescent: false
        is_absorbing: false
      - name: bleached
        is_fluorescent: false
        is_absorbing: false
        is_terminal: true
    thermal_rates:
      S1:
        S0: 3.57e+08            # 1/τ = 1/2.8ns = 3.57e8 s⁻¹
        T1: 1.0e+06
        bleached: 1.0e+03
      T1:
        S0: 1.0e+04
        bleached: 1.0e+02
    absorption_cross_section: 2.5e-16
    excitation_wavelength: 462.0
    extinction_coeff: 64000.0
    tau_rad: 2.8e-09            # ns (radiative lifetime)
    tau_nr_base: 1.0e-07        # Base nonradiative lifetime
    environment_sensitivity: none

  - name: Venus
    states:
      - name: S0
        is_fluorescent: false
        is_absorbing: true
      - name: S1
        is_fluorescent: true
        quantum_yield: 0.57
        emission_wavelength: 528.0
      - name: T1
        is_fluorescent: false
        is_absorbing: false
      - name: bleached
        is_fluorescent: false
        is_absorbing: false
        is_terminal: true
    thermal_rates:
      S1:
        S0: 3.33e+08             # 1/τ_rad = 1/3.0e-9 s = 3.33e8 s⁻¹ (Venus)
        T1: 5.0e+05
        bleached: 5.0e+02
      T1:
        S0: 5.0e+03
        bleached: 50.0
    absorption_cross_section: 1.5e-16
    excitation_wavelength: 515.0
    extinction_coeff: 92200.0
    tau_rad: 3.0e-09             # 3.0 ns (Venus radiative lifetime, was 3.0e-10 typo)
    tau_nr_base: 1.0e-08
    environment_sensitivity: none

# ─── FRET PAIRS ──────────────────────────────────────────────────────
# FRET pair: mTFP1 (donor) ↔ Venus (acceptor)
#
# Förster radius R₀ = 5.4 nm (computed from spectral overlap and FP properties).
# κ² = 2/3 (isotropic orientation assumption, valid for flexible linkers).
# Intra-complex distance = 5.0 nm (D-A separation in PH-Akt biosensor).
#
# FRET mode: BOND (CORRECTED from proximity)
#   PH-Akt biosensor binds PIP3 → PHAkt_PIP3 complex formed.
#   In bound state: mTFP1 and Venus are at ~5 nm → high FRET (E = 0.613).
#   In free state: no FRET (donor-only lifetime).
#   This matches the real experimental readout: binding event → conformational FRET.
# Reference: Ai et al., Nat Biotechnol 2006 (mTFP1-Venus FRET pair Förster radius).
#            Corbin et al., Biochemistry 2004 (PH-Akt binding to PIP3).
#
fret_pairs:
  - donor_type: mTFP1
    acceptor_type: Venus
    R0: 5.4                     # nm (Förster radius, mTFP1-Venus pair)
    kappa2: 0.6667              # Isotropic orientation
    intra_complex_distance: 5.0 # nm (D-A distance in PHAkt_PIP3 complex, bound state)
    fret_mode: bond              # CORRECTED: binding-based FRET (was proximity)
    intramolecular: true         # Both D+A on same construct (PH-Akt biosensor)
    # When PHAkt binds PIP3 (bond_partner >= 0): conformational change
    # brings mTFP1-Venus to 5nm → E = 1/(1+(5.0/5.4)⁶) = 0.613. When unbound: no FRET.

# ─── DYE ATTACHMENTS ──────────────────────────────────────────────────
# PH-Akt FRET biosensor: both mTFP1 (donor) and Venus (acceptor) on PHAkt.
#
# The biosensor is a single construct with both fluorophores.
# Simulation: one dye per particle → mTFP1 on PHAkt (donor channel for FLIM).
# Venus is NOT placed as a separate particle — instead, intramolecular FRET
# is handled by the intramolecular=true flag in fret_pairs: when PHAkt is
# bonded (bond_partner >= 0), FRET activates at intra_complex_distance.
# Venus emission is implicit (absorbed energy from FRET goes to Venus).
#
# 100% labeling: every PHAkt IS the fluorescent biosensor construct.
# Reference: Varnai & Balla 1998, Lemmon 2008, Corbin et al. 2004.
#
dye_attachments:
  - species: PHAkt
    fluorophore: mTFP1
    labeling_efficiency: 1.0    # 100%: every PHAkt IS the biosensor
    linker_length: 2.0          # nm (flexible linker)
    position_on_species: headgroup

# ─── VIRTUAL MICROSCOPE ──────────────────────────────────────────────
# All-optical microscope simulation: laser excitation → photophysics → detection → TCSPC
#
objective:
  NA: 1.4                       # High NA objective (oil immersion)
  magnification: 100.0
  immersion: oil
  n_immersion: 1.515

# Excitation laser: 462 nm (for mTFP1)
laser:
  wavelength: 462.0             # nm (mTFP1 optimal excitation)
  repetition_rate: 4.0e+07      # 40 MHz pulsed laser
  pulse_width: 1.0e-10          # 100 ps pulses (typical for modern TCSPC)
  power: 5.0e-06                # W (5 µW, low phototoxicity)
  beam_profile: gaussian        # Gaussian beam waist
  beam_waist: 250.0             # nm (FWHM)

# Single-photon avalanche photodiode (SPAD) detector
detector:
  type: SPAD
  dark_count_rate: 100.0        # Hz (ambient dark counts)
  detection_efficiency: 0.2     # 20% quantum efficiency at 492 nm
  timing_jitter: 5.0e-11        # 50 ps instrument response
  dead_time: 1.0e-07            # 100 ns (realistic SPAD afterpulsing)
  afterpulsing_prob: 0.005      # 0.5% afterpulsing probability

# Confocal scan parameters
scan:
  mode: confocal
  pixel_size: 100.0             # nm/pixel (Nyquist for confocal FWHM=125nm: pixel<62.5nm)
  pixels_x: 50                  # 50 × 100nm = 5.0 µm
  pixels_y: 50
  dwell_time: 2.0e-05           # s/pixel (20 µs, standard for FLIM)
  n_frames: 30                  # 30 frames for temporal evolution
  frame_interval: 1.0           # s (frame-to-frame time)
  pinhole_diameter: 1.0         # Airy disk (1.0 AU = confocal condition)

# Time-correlated single-photon counting (TCSPC) parameters
tcspc:
  n_bins: 256                   # Lifetime histogram resolution
  time_range: 2.5e-08           # 25 ns (1/40MHz laser period)

# Point spread function (Gibson-Lanni model)
psf:
  type: gibson_lanni            # Realistic PSF for oil-immersion objective
  emission_wavelength: 492.0    # mTFP1 emission

# ─── PAIR POTENTIALS ──────────────────────────────────────────────────
# Soft harmonic repulsion replaces WCA (1/r¹² divergence → numerical explosion).
# V(r) = ½ k (σ−r)² for r < σ ; V(r) = 0 for r ≥ σ.
# F_max = k·σ is BOUNDED regardless of overlap depth.
#
# k (spring_constant) calibrated so that at thermal equilibrium the
# characteristic penetration depth δ = √(kBT/k) << σ:
#   k = 50 kBT/µm² ≈ 50e6 kBT/nm² → δ ≈ 0.14 µm (in sim units).
#   With σ = 8nm = 0.008 µm: F_max = 50 × 0.008 = 0.4 kBT/µm.
#   At dt=10⁻⁵s, D=0.1: Δx_rms = √(2Ddt) = 1.4nm << σ. Stable. ✓
#
# Pattern: ReaDDy 2 add_harmonic_repulsion()
# Reference: Schöneberg & Noé (2013) PLoS ONE 8:e74261 — ReaDDy framework.
#            Heyes & Melrose (1993) J Non-Newt Fluid Mech 46:1 — soft repulsion.
#
potentials:
  # PI3K self-interaction
  - species_a: PI3K
    species_b: PI3K
    potential_type: harmonic_repulsion
    parameters:
      sigma: 8.0                # nm (exclusion diameter)
      spring_constant: 50.0     # kBT/µm² (soft repulsion strength)
      interaction_distance: 8.0 # nm (= σ, cutoff for cell list)

  # PTEN_T1 self-interaction
  - species_a: PTEN_T1
    species_b: PTEN_T1
    potential_type: harmonic_repulsion
    parameters:
      sigma: 8.0
      spring_constant: 50.0
      interaction_distance: 8.0

  # PTEN_T2 self-interaction
  - species_a: PTEN_T2
    species_b: PTEN_T2
    potential_type: harmonic_repulsion
    parameters:
      sigma: 8.0
      spring_constant: 50.0
      interaction_distance: 8.0

  # PI3K–PTEN_T1 cross-interaction
  - species_a: PI3K
    species_b: PTEN_T1
    potential_type: harmonic_repulsion
    parameters:
      sigma: 8.0
      spring_constant: 50.0
      interaction_distance: 8.0

  # PI3K–PTEN_T2 cross-interaction
  - species_a: PI3K
    species_b: PTEN_T2
    potential_type: harmonic_repulsion
    parameters:
      sigma: 8.0
      spring_constant: 50.0
      interaction_distance: 8.0

  # PTEN_T1–PTEN_T2 cross-interaction
  - species_a: PTEN_T1
    species_b: PTEN_T2
    potential_type: harmonic_repulsion
    parameters:
      sigma: 8.0
      spring_constant: 50.0
      interaction_distance: 8.0

# ─── SIMULATION PARAMETERS ───────────────────────────────────────────
# Brownian Dynamics (BD) simulation parameters for membrane diffusion.
#
# Simulation time: 60s (sufficient to capture ~3 PIP3 wave cycles at ~20s period).
# BD timestep: 1µs (10⁻⁵ s) ensures stability for all diffusion coefficients.
#   Criterion: Δt << D/L² where L=5µm, D_min=0.02µm²/s → Δt < 5ms ✓
#
# Random seed: 42 (fixed for reproducibility)
# PSS mode: true (Particle State Sequence — fast, statistically exact)
# Threads: 8 (parallel OpenMP execution)
# RAM limit: 12 GB (conservative for 50×50 pixel confocal + 30 frames)
#
simulation_time: 60.0           # s (3 wave cycles at ~20s period)
bd_timestep: 1.0e-05            # s (10 µs — stable for all D)
random_seed: 42
pss_mode: true    # PSS (default, fast). Set false for PbP (exact photon stats, ~34x slower)
n_threads: 8
ram_limit_gb: 12.0

# ─── BD SAFETY PARAMETERS ───────────────────────────────────────────
# Displacement cap: |Δx| ≤ 0.5 × min(σ) = 0.5 × 8nm = 4nm per step.
# Prevents any kick (noise or force) from overshooting the interaction
# potential well, even if dt is transiently large or force spikes.
displacement_cap_fraction: 0.5  # fraction of min(σ)

# Sigmoid smoothing width for D(x) field transitions.
# ∇D must be finite for correct Ermak-McCammon drift correction
# (Lau & Lubensky 2007). Width 50nm ensures smooth gradient over ~3σ.
region_smoothing_width: 0.05    # µm (= 50 nm)
